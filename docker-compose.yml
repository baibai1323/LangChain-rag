services:
  rag:
    build: .
    image: langchain-rag:latest
    container_name: langchain-rag
    ports:
      - "8000:8000"
    environment:
      # 建议在 .env 或 shell 里提供，不要写死在 compose 文件里
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?请先设置 DASHSCOPE_API_KEY}
      QWEN_CHAT_MODEL: ${QWEN_CHAT_MODEL:-qwen-max}
      QWEN_FAST_MODEL: ${QWEN_FAST_MODEL:-qwen-turbo}
    volumes:
      - ./data:/data
    restart: unless-stopped
